<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedEvidência Pro - Explorador de Pesquisa Clínica</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700;900&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0faff',
              100: '#e0f4ff',
              200: '#b9eaff',
              300: '#7cd9ff',
              400: '#34c5ff',
              500: '#00a9ff', // Clearer blue
              600: '#0085d6',
              700: '#0069ab',
              800: '#00598f',
              900: '#054a72',
              950: '#03314d',
            },
            medical: {
              teal: '#0d9488',
              navy: '#0f172a',
              slate: '#64748b',
            }
          },
          boxShadow: {
            'premium': '0 20px 50px -12px rgba(0, 0, 0, 0.08)',
            'glow-blue': '0 0 25px rgba(0, 169, 255, 0.15)',
          }
        }
      }
    }
  </script>

  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "recharts": "https://esm.sh/recharts@^2.15.0",
    "jspdf": "https://esm.sh/jspdf@^2.5.1",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@^3.8.2"
  }
}
</script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      background-image: 
        radial-gradient(at 0% 0%, rgba(0, 169, 255, 0.03) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(13, 148, 136, 0.03) 0px, transparent 50%);
      background-attachment: fixed;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Outfit', sans-serif;
    }

    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(241, 245, 249, 1);
    }

    .glass-dark {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-hover {
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .card-hover:hover {
      transform: translateY(-8px);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
